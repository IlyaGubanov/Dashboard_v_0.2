# Тестовый источник запускается только по явному --profile video-test.
services:
  video-test-source:
    image: bluenviron/mediamtx:1.21.3
    profiles: [video-test]
    environment:
      MTX_RTSPADDRESS: :8554
      MTX_RTMP: "no"
      MTX_HLS: "no"
      MTX_WEBRTC: "no"
      MTX_SRT: "no"
      MTX_MOQ: "no"
    networks: [default]
  video-test-publisher:
    profiles: [video-test]
    build:
      context: .
      dockerfile: deploy/mediamtx/test-source.Dockerfile
    depends_on: [video-test-source]
    command: ["-re", "-f", "lavfi", "-i", "testsrc2=size=704x576:rate=15", "-an", "-c:v", "libx264", "-preset", "ultrafast", "-pix_fmt", "yuv420p", "-g", "30", "-b:v", "512k", "-f", "rtsp", "-rtsp_transport", "tcp", "rtsp://video-test-source:8554/cam/realmonitor"]
    restart: unless-stopped
