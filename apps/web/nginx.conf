server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 50m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy same-origin always;

  location = /_video_auth {
    internal;
    proxy_pass http://api:3000/api/video/media-auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_cache off;
  }

  # Every playlist, initialization file and segment is authorized using the live application session.
  location ~ "^/media/(cam-[1-9][0-9]{0,9})/([A-Za-z0-9_-]+\.(?:m3u8|mp4|m4s|ts))$" {
    set $video_path $1/$2;
    auth_request /_video_auth;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $media_upstream mediamtx:8888;
    proxy_pass http://$media_upstream/$video_path$is_args$args;
    proxy_set_header Authorization "Bearer ${VIDEO_CDN_TOKEN}";
    proxy_set_header Cookie "";
    proxy_set_header Host mediamtx;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;
    proxy_cache off;
    proxy_no_cache 1;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
    proxy_read_timeout 25s;
  }
  location /media/ { return 404; }
  location = /api/video/media-auth { return 404; }
  location /api/video/internal/ { return 404; }

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # протокол, по которому пришёл пользователь (https), передаёт caddy
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 120s;
  }

  # файлы сборки с хэшем в имени — кэшируем надолго
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # манифест для установки на телефон
  location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
    add_header Cache-Control "no-cache";
  }

  # маршруты приложения отдаёт index.html
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
