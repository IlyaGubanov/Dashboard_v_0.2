name: CI

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      # Disposable service databases only; no repository/environment secrets.
      ADMIN_PASSWORD: CiOnlyDatabase2026
      DATABASE_URL: mysql://root:ci-only@127.0.0.1:3306/mvs_ci_test
      FLEET_TEST_DATABASE_URL: mysql://root:ci-only@127.0.0.1:3306/mvs_fleet_test
      MAP_TEST_DATABASE_URL: mysql://root:ci-only@127.0.0.1:3306/mvs_map_test
      REPORT_TEST_DATABASE_URL: mysql://root:ci-only@127.0.0.1:3306/mvs_report_test
      PANORAMA_TEST_DATABASE_URL: mysql://root:ci-only@127.0.0.1:3306/mvs_panorama_test
      VIDEO_TEST_DATABASE_URL: mysql://root:ci-only@127.0.0.1:3306/video_unit
      DELAY_TEST_DATABASE_URL: mysql://root:ci-only@127.0.0.1:3306/mvs_delay_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build -w @mvs/shared
      - name: Git workflow check
        run: node --test .github/scripts/sync-strategy.test.cjs
      - run: npm run typecheck
      - name: Check Prisma auxiliary TypeScript
        run: npx tsc --noEmit -p apps/api/prisma/tsconfig.json
      - name: Prepare isolated test databases
        shell: bash
        run: |
          for db in mvs_ci_test mvs_fleet_test mvs_map_test mvs_report_test mvs_panorama_test video_unit mvs_delay_test; do
            mysql -h 127.0.0.1 -u root -pci-only -e "CREATE DATABASE IF NOT EXISTS $db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
            DATABASE_URL="mysql://root:ci-only@127.0.0.1:3306/$db" npm run db:migrate
            DATABASE_URL="mysql://root:ci-only@127.0.0.1:3306/$db" npm run db:seed
          done
          npm run db:demo -w @mvs/api
      - run: npm run test -w @mvs/api
      - run: npm run build
